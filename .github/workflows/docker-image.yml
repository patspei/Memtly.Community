name: Docker Image CI
on:
  push:
    branches: [ "master", "feature/wedding-customizations" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Self
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install HEIC decoder for Linux regression tests
        run: sudo apt-get update && sudo apt-get install -y imagemagick libheif-plugin-libde265 libheif-plugin-x265 util-linux

      - name: Restore
        run: dotnet restore --locked-mode Memtly.Community.sln

      - name: Build Debug
        run: dotnet build Memtly.Community.sln -c Debug --no-restore

      - name: Test gallery layout lifecycle
        run: npm --prefix Memtly.Core/Memtly.Core test

      - name: Build Release
        run: dotnet build Memtly.Community.sln -c Release --no-restore

      - name: Test
        run: dotnet test Memtly.Community.sln -c Release --no-build --no-restore

      - name: Audit
        run: dotnet package list --project Memtly.Community.sln --vulnerable --include-transitive --no-restore

  build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/wedding-customizations'
    runs-on: ubuntu-latest
    needs: test
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout Self
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Memtly.Community/Dockerfile
          push: true
          no-cache: true
          platforms: linux/amd64
          tags: |
            ghcr.io/patspei/memtly.community:wedding-dev
            ghcr.io/patspei/memtly.community:${{ github.sha }}

      - name: Record immutable image reference
        run: |
          echo 'ghcr.io/patspei/memtly.community:${{ github.sha }}@${{ steps.image.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
